<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>キッズ タスクかんり - {{ title }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="header">
        <a href="{{ url_for('home') }}" class="back-btn">🏠もどる</a>
        <div class="header-title">
            <h1>{{ title }}</h1>
        </div>
        <div class="clock-container">
            <canvas id="analogClock" width="100" height="100"></canvas>
            <div id="digitalClock" class="digital-clock">00:00</div>
        </div>
    </div>

    <div class="main-container">
        {% for kid_id, kid_info in kids.items() %}
        <div class="kid-section" id="section-{{ kid_id }}">
            <h2>{{ kid_info.name }}</h2>
            <ul class="task-list">
                {% for task in kid_info.tasks %}
                <li class="task-item" data-task-id="{{ task.id }}">
                    <div class="task-icon">{{ task.icon }}</div>
                    <div class="task-details">
                        <span class="task-time">{{ task.time|format_time_jp }}</span>
                        <span class="task-text">{{ task.text }}</span>
                    </div>
                    <div class="task-action">
                        <input type="checkbox" class="task-checkbox" onchange="toggleTask(this)">
                    </div>
                </li>
                {% endfor %}
            </ul>
            <div class="done-action" style="text-align: center; margin-top: 20px;">
                <button class="btn-done" id="btn-done-{{ kid_id }}" style="display: none;"
                    onclick="markDone('{{ kid_id }}', '{{ time_of_day }}')">🎉 できた！</button>
            </div>
        </div>
        {% endfor %}
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>

</html>
